[project]
name = "dist-pert"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "nlpaug>=1.1.11",
    "transformers>=4.0",
    "torch>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
image = ["Pillow>=9.0", "scipy>=1.10", "imagecorruptions>=1.1"]

[project.scripts]
dist-perturb = "dist_pert.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
